plugins {
    id "com.android.application" 
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}


def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}


android {
    compileSdkVersion 35
    namespace 'com.growtokyo'
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.growtokyo.staging"
        minSdk 24
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    flavorDimensions "default"
    productFlavors {
        stag {
            dimension "default"
            applicationId "com.growtokyo.staging"
        }
        prod {
            dimension "default"
            applicationId "com.growtokyo"
        }
    }

    signingConfigs {
        release {
            storeFile file('../grow_tokyo.keystore')
            keyAlias 'grow_tokyo'
            storePassword 'growTokyo'
            keyPassword 'growTokyo'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            applicationVariants.all { variant ->
                variant.outputs.all {
                    def releaseTime = new Date().format("ddMMyyyyHHmmss")
                    outputFileName = "growTokyo-${variant.getFlavorName()}-${defaultConfig.versionCode}-${releaseTime}.apk"
                }
            }
        }
    }

    compileOptions {
        // Enable core library desugaring
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // ✅ Add this block to fix Kotlin JVM target error
    kotlinOptions {
        jvmTarget = "1.8"
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}



flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.0.0')
    implementation 'com.android.support:multidex:1.0.3'
    implementation 'com.google.android.material:material:1.7.0-alpha01'
    
    // Core library desugaring for flutter_local_notifications
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
